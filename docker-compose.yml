# Local stack: Kafka (KRaft) + PostgreSQL + consumer + API + Prometheus + Grafana.
#   cp .env.example .env            # set local passwords
#   docker compose up -d --build    # core pipeline
#   docker compose --profile demo up -d producer   # synthetic traffic
# Every host port is bound to 127.0.0.1 only.

x-app: &app
  build: .
  image: realtime-streaming-analytics:local
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &app-env
    STREAM_BOOTSTRAP_SERVERS: kafka:19092
    STREAM_DATABASE_URL: postgresql://${POSTGRES_USER:-rsa}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rsa}
    STREAM_LOG_LEVEL: ${STREAM_LOG_LEVEL:-INFO}

services:
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (partitions, retention) by the `topics` job.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rsa}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsa} -d ${POSTGRES_DB:-rsa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics:
    <<: *app
    restart: "no"
    command: ["topics"]
    depends_on:
      kafka: {condition: service_healthy}

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}

  consumer:
    <<: *app
    command: ["consume"]
    depends_on:
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 30s

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      STREAM_API_HOST: 0.0.0.0
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    <<: *app
    profiles: [demo]
    restart: "no"
    command:
      - produce
      - --count=${PRODUCER_COUNT:-50000}
      - --rate=${PRODUCER_RATE:-50}
      - --duplicate-rate=${PRODUCER_DUPLICATE_RATE:-0.02}
      - --malformed-rate=${PRODUCER_MALFORMED_RATE:-0.01}
    depends_on:
      topics: {condition: service_completed_successfully}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  kafka-data:
  pg-data:
  prom-data:
