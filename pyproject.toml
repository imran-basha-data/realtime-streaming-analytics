[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-streaming-analytics"
version = "1.0.0"
description = "Kafka event streaming into PostgreSQL with validation, dead-lettering and idempotent processing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohd Imran Basha" }]
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
stream = "streaming.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streaming = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL and/or Kafka (STREAM_TEST_DATABASE_URL, STREAM_TEST_BOOTSTRAP_SERVERS)",
]

[tool.coverage.run]
source = ["streaming"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["streaming"]
known-local-folder = ["conftest", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/streaming"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
